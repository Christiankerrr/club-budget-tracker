<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Club Budget Tracker{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="topbar">
  <a class="brand" href="{{ url_for('main.index') }}">Club Budget Tracker</a>
  <nav>
    {% if g.user %}
      <a href="{{ url_for('main.clubs') }}">My Clubs</a>
      <span class="muted">{{ g.user.username }}</span>
      <form method="post" action="{{ url_for('main.logout') }}" class="inline">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button class="link">Log out</button>
      </form>
    {% else %}
      <a href="{{ url_for('main.login') }}">Log in</a>
      <a href="{{ url_for('main.register') }}">Register</a>
    {% endif %}
  </nav>
</header>
<main class="container">
  {% for category, message in get_flashed_messages(with_categories=true) %}
    <div class="flash {{ category }}">{{ message }}</div>
  {% endfor %}
  {% block content %}{% endblock %}
</main>
{% block scripts %}{% endblock %}
</body>
</html>
